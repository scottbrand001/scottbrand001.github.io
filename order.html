<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scott</title>
<style>
  *{ box-sizing: border-box; }

  html, body{ margin:0; min-height:100%; background:#000000; }

  body{
    font-family: system-ui, sans-serif;
    color:#ffffff;
    padding: 32px 20px 80px;
  }

  /* ---------- Password gate ---------- */
  #gate{
    min-height: 80vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }

  #gate img{ width:130px; margin-bottom:40px; }

  #gate input{
    width:100%;
    max-width:280px;
    background:#000;
    border:1px solid #333;
    color:#fff;
    text-align:center;
    letter-spacing:2px;
    font-size:16px;
    padding:14px;
    border-radius:2px;
    outline:none;
  }

  #gate input:focus{ border-color:#fff; }
  #gate input.invalid{ border-color:#ff5c4d; }

  #gate button{
    margin-top:14px;
    width:100%;
    max-width:280px;
    background:#ffffff;
    border:none;
    padding:14px;
    border-radius:2px;
    font-weight:700;
    cursor:pointer;
  }

  /* ---------- Catalog ---------- */
  #catalog{ display:none; max-width:1000px; margin:0 auto; }

  #catalog .brand{ display:flex; justify-content:center; margin-bottom:24px; }
  #catalog .brand img{ width:100px; }

  .marquee{
    overflow:hidden;
    white-space:nowrap;
    background:#000000;
    color:#ffffff;
    border-top:1px solid #222;
    border-bottom:1px solid #222;
    padding:10px 0;
    margin-bottom:40px;
    font-size:13px;
    font-weight:700;
    letter-spacing:0.03em;
  }

  .marquee span{
    display:inline-block;
    padding-left:100%;
    animation: marquee 16s linear infinite;
  }

  @keyframes marquee{
    0%{ transform: translateX(0); }
    100%{ transform: translateX(-100%); }
  }

  @media (prefers-reduced-motion: reduce){
    .marquee span{ animation: none; padding-left:0; }
  }

  .card .sizes{ color:#aaa; font-size:12px; margin-bottom:12px; }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 170px));
    gap: 24px;
    justify-content: center;
  }

  .card{
    padding:14px;
  }

  .card img{
    width:100%;
    max-width:150px;
    aspect-ratio: 1;
    object-fit:contain;
    margin:0 auto 12px;
    display:block;
    background:transparent;
    filter: drop-shadow(0 0 14px rgba(255,255,255,0.5)) drop-shadow(0 0 30px rgba(255,255,255,0.22));
  }

  .card .name{ font-size:15px; margin-bottom:4px; }
  .card .price{ color:#aaa; font-size:14px; margin-bottom:12px; }

  .card button{
    width:100%;
    background:#ffffff;
    color:#000;
    border:none;
    padding:11px;
    border-radius:2px;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }

  /* ---------- Order form (modal) ---------- */
  #overlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(0,0,0,0.85);
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:10;
  }

  #modal{
    width:100%;
    max-width:360px;
    background:#0a0a0a;
    border:1px solid #333;
    border-radius:4px;
    padding:28px 22px;
  }

  #modal .product-name{ font-size:16px; margin-bottom:2px; }
  #modal .product-price{ color:#aaa; font-size:14px; margin-bottom:22px; }

  #modal input{
    width:100%;
    background:#000;
    border:1px solid #333;
    color:#fff;
    font-size:15px;
    padding:12px 14px;
    border-radius:2px;
    outline:none;
    margin-bottom:12px;
  }

  #modal input:focus{ border-color:#fff; }
  #modal input.invalid{ border-color:#ff5c4d; }

  #modal button[type="submit"]{
    width:100%;
    background:#ffffff;
    border:none;
    padding:13px;
    border-radius:2px;
    font-weight:700;
    cursor:pointer;
    margin-top:6px;
  }

  #modal .close{
    background:none;
    border:none;
    color:#777;
    font-size:13px;
    display:block;
    margin:14px auto 0;
    cursor:pointer;
  }

  #modal .sent{ display:none; text-align:center; padding:20px 0; }
</style>
</head>

  <div class="marquee"><span>LIMITED EDITION — ONLY A FEW PIECES AVAILABLE — ORDER NOW &nbsp;&nbsp;&nbsp;&nbsp; LIMITED EDITION — ONLY A FEW PIECES AVAILABLE — ORDER NOW</span></div>

  <div class="grid" id="grid"></div>
</div>

<!-- ================= ORDER MODAL ================= -->
<div id="overlay">
  <div id="modal">
    <div id="modal-form">
      <div class="product-name" id="modalProductName"></div>
      <div class="product-price" id="modalProductPrice"></div>
      <form id="orderForm">
        <input type="hidden" id="orderProduct" name="product">
        <input type="text" id="orderName" name="name" placeholder="Full name" required>
        <input type="tel" id="orderPhone" name="phone" placeholder="Phone number" required>
        <select id="orderSize" name="size" required style="width:100%; background:#000; border:1px solid #333; color:#fff; font-size:15px; padding:12px 14px; border-radius:2px; outline:none; margin-bottom:12px;">
          <option value="" disabled selected>Size</option>
          <option value="S">S</option>
          <option value="M">M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
        </select>
        <input type="text" id="orderCity" name="city" placeholder="City">
        <button type="submit">Confirm order</button>
      </form>
      <button class="close" onclick="closeModal()">Cancel</button>
    </div>
    <div class="sent" id="modalSent">
      Order received. We'll contact you to confirm.
      <button class="close" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<script>
  /* =========================================================
     ACCESS CODE — bdel had l-kelma bach tbedel l-password
  ========================================================= */
  const ACCESS_CODE = "SCOTT001";

  /* =========================================================
     PRODUCTS — zid produit jdid: copié wa7ed block w bedlou.
     image: smiya dyal fichier li ghadi tzid f folder "products/"
     name: smiya dyal produit
     price: prix (bla "DH", katzad wa7dha)
  ========================================================= */
  const PRODUCTS = [
    { image: "products/product1.png", name: "T-shirt Scott", price: "169 DH", sizes: "S / M / L / XL" },

    // Zid hna produit jdid, copié had block w bedlou:
    // { image: "products/product2.png", name: "Nom du produit", price: "XXX DH", sizes: "S / M / L / XL" },
  ];

  /* ---------- Render products ---------- */
  const grid = document.getElementById('grid');
  PRODUCTS.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <img src="${p.image}" alt="${p.name}">
      <div class="name">${p.name}</div>
      <div class="sizes">${p.sizes || ''}</div>
      <div class="price">${p.price}</div>
      <button data-index="${i}">Order</button>
    `;
    grid.appendChild(card);
  });

  /* ---------- Password gate ---------- */
  const pwInput = document.getElementById('pwInput');
  const pwBtn = document.getElementById('pwBtn');

  function tryUnlock(){
    if(pwInput.value.trim().toUpperCase() === ACCESS_CODE){
      document.getElementById('gate').style.display = 'none';
      document.getElementById('catalog').style.display = 'block';
    } else {
      pwInput.classList.add('invalid');
    }
  }

  pwBtn.addEventListener('click', tryUnlock);
  pwInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') tryUnlock(); });
  pwInput.addEventListener('input', () => pwInput.classList.remove('invalid'));

  /* ---------- Order modal ---------- */
  const ORDER_ENDPOINT = "https://formspree.io/f/xyekgary";

  const overlay = document.getElementById('overlay');
  const modalForm = document.getElementById('modal-form');
  const modalSent = document.getElementById('modalSent');
  const orderForm = document.getElementById('orderForm');

  grid.addEventListener('click', (e) => {
    if(e.target.tagName !== 'BUTTON') return;
    const p = PRODUCTS[e.target.dataset.index];
    document.getElementById('modalProductName').textContent = p.name;
    document.getElementById('modalProductPrice').textContent = p.price;
    document.getElementById('orderProduct').value = p.name + ' - ' + p.price;
    modalForm.style.display = 'block';
    modalSent.style.display = 'none';
    orderForm.reset();
    document.getElementById('orderProduct').value = p.name + ' - ' + p.price;
    overlay.style.display = 'flex';
  });

  function closeModal(){ overlay.style.display = 'none'; }
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });

  orderForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const nameInput = document.getElementById('orderName');
    const phoneInput = document.getElementById('orderPhone');
    const sizeInput = document.getElementById('orderSize');
    let ok = true;

    // Full name: at least two words (first + last name), letters only (Latin or Arabic)
    const nameRegex = /^[A-Za-zÀ-ÿ\u0600-\u06FF]{2,}(\s[A-Za-zÀ-ÿ\u0600-\u06FF]{2,})+$/;
    if(!nameRegex.test(nameInput.value.trim())){ nameInput.classList.add('invalid'); ok = false; }
    else nameInput.classList.remove('invalid');

    // Phone: Moroccan mobile format (0/+212/00212 followed by 5-7 and 8 more digits)
    const cleanedPhone = phoneInput.value.replace(/[\s\-]/g, '');
    const phoneRegex = /^(0|\+212|00212)[5-7]\d{8}$/;
    if(!phoneRegex.test(cleanedPhone)){ phoneInput.classList.add('invalid'); ok = false; }
    else phoneInput.classList.remove('invalid');

    if(!sizeInput.value){ sizeInput.style.borderColor = '#ff5c4d'; ok = false; }
    else sizeInput.style.borderColor = '#333';

    if(!ok) return;

    document.getElementById('orderProduct').value += ' | Size: ' + sizeInput.value;

    const btn = orderForm.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.textContent = 'Sending...';

    try{
      const res = await fetch(ORDER_ENDPOINT, {
        method:'POST',
        headers:{ 'Accept':'application/json' },
        body: new FormData(orderForm)
      });
      if(res.ok){
        modalForm.style.display = 'none';
        modalSent.style.display = 'block';
      } else {
        phoneInput.classList.add('invalid');
      }
    } catch(err){
      phoneInput.classList.add('invalid');
    }

    btn.disabled = false;
    btn.textContent = 'Confirm order';
  });
</script>

</body>
</html>
